<div class="modal-box {{ isModalOpen() ? 'show' : '' }}">
  <div class="add-modal {{ isDarkMode() ? 'dark-mode' : '' }}">
    <div class="header">
      <h3>Add New Topic</h3>
      <button class="button icon {{ isDarkMode() ? 'dark-mode' : '' }}" (click)="closeAddModal()">
        <img
          src="{{ isDarkMode() ? '/assets/close-dark.svg' : '/assets/close-light.svg' }}"
          alt="Close"
        />
      </button>
    </div>
    <br />
    <form>
      <div class="form-group">
        <label for="topicName">Topic Name:</label>
        <input
          type="text"
          id="topicName"
          name="topicName"
          required
          class="{{ isDarkMode() ? 'dark-mode' : '' }}"
        />
      </div>
      <div class="form-group">
        <label for="consumerGroup">Consumer Group:</label>
        <input
          type="text"
          id="consumerGroup"
          name="consumerGroup"
          required
          class="{{ isDarkMode() ? 'dark-mode' : '' }}"
        />
      </div>
      <div class="submit">
        <button class="button blue" type="submit">Add Topic</button>
        <button class="button red" (click)="closeAddModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>
