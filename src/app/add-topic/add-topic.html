<div class="modal-box">
    <div class="add-modal">
        <h2>Add New Topic</h2>
        <br>
        <form>
            <div class="form-group">
                <label for="topicName">Topic Name:</label>
                <input type="text" id="topicName" name="topicName" required />
            </div>
            <div class="form-group">
                <label for="consumerGroup">Consumer Group:</label>
                <input type="text" id="consumerGroup" name="consumerGroup" required />
            </div>
            <button class="button" type="submit">Add Topic</button>
        </form>
    </div>
</div>
